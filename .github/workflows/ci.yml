name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt

      - name: Resolve the macOS temporary directory
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"

      - name: Build and run xUnit
        run: dotnet test MapLarge.FileBrowser.sln -c Release

      - name: Install Playwright test dependencies
        run: python -m pip install -r tests/requirements-browser.txt

      - name: Install browsers and Linux system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Install browsers on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m playwright install chromium firefox webkit

      - name: Run Playwright behavior tests
        run: python -m pytest tests/test_browser_matrix.py -k "not visual_baseline"
